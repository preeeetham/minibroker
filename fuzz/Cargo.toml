[package]
name = "minibroker-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }

[dependencies.minibroker]
path = ".."

# Keep the fuzz crate out of the main crate's build.
[workspace]
members = ["."]

[[bin]]
name = "decode_stream"
path = "fuzz_targets/decode_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_frame"
path = "fuzz_targets/parse_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "topic_match"
path = "fuzz_targets/topic_match.rs"
test = false
doc = false
bench = false
