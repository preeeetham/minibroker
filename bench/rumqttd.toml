# rumqttd config for the P14 comparison: one MQTT 3.1.1 listener on
# loopback, router settings from rumqttd's shipped sample config. The
# console, Prometheus, websocket and MQTT 5 listeners are left out so
# neither broker runs extra listeners or exporters.
id = 0

[router]
id = 0
max_connections = 10010
max_outgoing_packet_count = 200
max_segment_size = 104857600
max_segment_count = 10

[v4.1]
name = "v4-1"
listen = "127.0.0.1:1883"
next_connection_delay_ms = 1
    [v4.1.connections]
    connection_timeout_ms = 60000
    max_payload_size = 1048576
    max_inflight_count = 100
    dynamic_filters = true
