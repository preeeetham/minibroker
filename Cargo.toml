[package]
name = "minibroker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive"] }
futures = "0.3.34"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
